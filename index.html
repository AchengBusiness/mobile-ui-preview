<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07c160">
<link rel="manifest" href="manifest.json">
<title>UI Preview Tool</title>
<style>
:root{--green:#07c160;--blue:#1677ff;--red:#fa2c19;--pink:#fe2c55;--dark:#111;--gray:#f5f5f5;--border:#e8e8e8;--text:#333;--text2:#999;--radius:12px;--gold:#f0a020}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif;background:#f5f5f5;color:var(--text);font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior:none;height:100%}
input,select,textarea,button{font-family:inherit;font-size:inherit;outline:none;border:none;-webkit-appearance:none;appearance:none}
button{cursor:pointer;background:none}
img{display:block;max-width:100%}

/* ===== App Container ===== */
#app{max-width:430px;margin:0 auto;height:100vh;position:relative;overflow:hidden;background:#f5f5f5}

/* ===== Screen System ===== */
.screen{position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1;background:#f5f5f5;-webkit-overflow-scrolling:touch;will-change:transform}
.screen.active{transform:translateX(0);z-index:10}
.screen.prev{transform:translateX(-30%);z-index:5}

/* ===== Home Screen ===== */
.home-header{background:linear-gradient(135deg,var(--green),#05a854);padding:60px 24px 32px;color:#fff;position:relative}
.home-header h1{font-size:24px;font-weight:700}
.home-header p{font-size:13px;opacity:.8;margin-top:6px}
.home-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-card{background:#fff;border-radius:var(--radius);padding:20px 16px;position:relative;overflow:hidden;transition:transform .15s}
.home-card:active{transform:scale(.97)}
.home-card .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;margin-bottom:12px}
.home-card .name{font-size:15px;font-weight:600;color:var(--text)}
.home-card .desc{font-size:12px;color:var(--text2);margin-top:4px}

/* ===== Disclaimer ===== */
.disclaimer{background:#fff3cd;border-left:4px solid #f0ad4e;padding:12px 16px;margin:12px 16px 0;border-radius:0 8px 8px 0;font-size:12px;color:#856404;line-height:1.6}
.disclaimer strong{color:#c8102e}

/* ===== Status Bar ===== */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 6px;height:48px;position:relative;z-index:10}
.statusbar .time{font-size:16px;font-weight:700;letter-spacing:-.2px}
.statusbar .right{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.statusbar .signal{display:flex;gap:1.5px;align-items:flex-end;height:11px}
.statusbar .signal i{display:block;width:3px;border-radius:1px}
.statusbar .batt{width:27px;height:12px;border:1.5px solid currentColor;border-radius:3px;position:relative;padding:1.5px}
.statusbar .batt::after{content:'';position:absolute;right:-5px;top:2.5px;width:2.5px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.statusbar .batt-fill{height:100%;border-radius:1px}

/* ===== Nav Bar ===== */
.navbar{display:flex;align-items:center;padding:6px 8px 12px;position:relative}
.navbar .back-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:28px;font-weight:300;color:inherit;transition:background .15s}
.navbar .back-btn:active{background:rgba(255,255,255,.15)}
.navbar .title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600}
.navbar .right-btn{position:absolute;right:16px;font-size:14px;opacity:.8}

/* ===== Form Components ===== */
.form-section{padding:16px}
.form-card{background:#fff;border-radius:var(--radius);padding:4px 0;margin-bottom:12px;overflow:hidden}
.form-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #f5f5f5}
.form-item:last-child{border-bottom:none}
.form-item label{width:90px;font-size:14px;color:var(--text2);flex-shrink:0}
.form-item input,.form-item select{flex:1;font-size:15px;color:var(--text);background:transparent;text-align:right;padding:0}
.form-item input::placeholder{color:#ccc}
.form-item select{direction:rtl}
.form-item .suffix{font-size:13px;color:var(--text2);margin-left:4px}

/* ===== Preview Frame ===== */
.preview-frame{margin:0 16px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.08);position:relative;background:#fff}
.preview-inner{position:relative}

/* ===== Export Bar ===== */
.export-bar{padding:12px 16px 32px;display:flex;gap:10px}
.export-bar button{flex:1;padding:14px;border-radius:10px;font-size:15px;font-weight:600;transition:opacity .15s}
.export-bar button:active{opacity:.7}
.btn-primary{background:var(--green);color:#fff}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}

/* ===== WeChat Transfer ===== */
.wx-transfer-page{background:#ededed;min-height:100%}
.wx-transfer-top{background:#fff;padding:24px 20px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.wx-transfer-avatar{width:48px;height:48px;border-radius:6px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:600;flex-shrink:0}
.wx-transfer-name{font-size:17px;font-weight:500}
.wx-success-page{background:#ededed;min-height:100%}
.wx-success-top{background:#fff;padding:40px 20px 32px;text-align:center}
.wx-success-icon{width:64px;height:64px;border-radius:50%;background:var(--green);margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.wx-success-icon svg{width:32px;height:32px;fill:#fff}
.wx-success-title{font-size:18px;font-weight:600;margin-bottom:8px}
.wx-success-amount{font-size:40px;font-weight:200;font-family:'DIN Alternate','Helvetica Neue',sans-serif;letter-spacing:-1px}
.wx-success-amount .sym{font-size:20px;font-weight:400;margin-right:2px}
.wx-success-detail{background:#fff;margin-top:10px}
.wx-success-detail .row{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #f5f5f5;font-size:14px}
.wx-success-detail .row .k{color:var(--text2)}
.wx-success-detail .row:last-child{border-bottom:none}

/* ===== Alipay ===== */
.ali-page{background:linear-gradient(180deg,var(--blue) 0%,var(--blue) 260px,#f5f5f5 260px);min-height:100%}
.ali-page .statusbar,.ali-page .navbar{color:#fff}
.ali-balance-area{text-align:center;padding:20px 0 36px;color:#fff}
.ali-balance-area .label{font-size:14px;opacity:.8;margin-bottom:12px}
.ali-balance-area .amount{font-size:46px;font-weight:200;font-family:'DIN Alternate','Helvetica Neue',sans-serif;letter-spacing:-1px}
.ali-balance-area .amount .sym{font-size:22px;margin-right:2px;font-weight:400}
.ali-btn-row{display:flex;justify-content:center;gap:40px;padding-bottom:28px}
.ali-btn-item{display:flex;flex-direction:column;align-items:center;color:#fff;gap:8px}
.ali-btn-item .circle{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.ali-btn-item span{font-size:12px;opacity:.9}
.ali-card{background:#fff;border-radius:var(--radius);margin:0 16px 12px;overflow:hidden}
.ali-card-row{display:flex;align-items:center;padding:16px;border-bottom:1px solid #f8f8f8}
.ali-card-row:last-child{border-bottom:none}
.ali-card-row .ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:12px;font-size:18px;color:#fff;flex-shrink:0}
.ali-card-row .info{flex:1}
.ali-card-row .info .t{font-size:15px}
.ali-card-row .info .d{font-size:12px;color:var(--text2);margin-top:2px}
.ali-card-row .val{font-size:14px;color:var(--text);margin-right:4px}
.ali-card-row .arrow{color:#c8c8c8}

/* ===== Douyin (Real Style - Light Theme) ===== */
.dy-page{background:#f5f5f5;min-height:100%}
.dy-page .statusbar,.dy-page .navbar{color:#333}
.dy-topbar{display:flex;align-items:center;padding:6px 16px 10px;gap:8px}
.dy-topbar .dy-title{font-size:18px;font-weight:600;color:#333}
.dy-topbar .dy-tag{font-size:11px;color:#999;background:#f0f0f0;padding:2px 8px;border-radius:12px}
.dy-topbar .dy-icons{margin-left:auto;display:flex;gap:16px}
.dy-blue-card{background:linear-gradient(135deg,#4a7dff 0%,#6b9bff 50%,#8fb5ff 100%);border-radius:16px;margin:0 14px 14px;padding:20px;color:#fff;position:relative;overflow:hidden}
.dy-blue-card::before{content:'';position:absolute;top:-40px;right:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.dy-blue-card .dy-total-label{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.dy-blue-card .dy-total-label .safe-tag{font-size:11px;background:rgba(255,255,255,.2);padding:1px 6px;border-radius:10px}
.dy-blue-card .dy-total-amount{font-size:44px;font-weight:300;font-family:'DIN Alternate','Helvetica Neue',sans-serif;letter-spacing:-1px;margin:8px 0 16px}
.dy-blue-card .dy-stats{display:flex;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
.dy-blue-card .dy-stats .dy-stat{flex:1;text-align:center}
.dy-blue-card .dy-stats .dy-stat .v{font-size:20px;font-weight:600;font-family:'DIN Alternate',sans-serif}
.dy-blue-card .dy-stats .dy-stat .l{font-size:11px;opacity:.7;margin-top:4px}
.dy-bill-row{background:#fff;border-radius:12px;margin:0 14px 10px;padding:14px 16px;display:flex;align-items:center;font-size:13px;color:#666}
.dy-bill-row .bill-label{font-weight:600;color:#333;margin-right:8px}
.dy-bill-row .bill-all{margin-left:auto;color:#999;font-size:13px}
.dy-service-grid{background:#fff;border-radius:12px;margin:0 14px 10px;padding:16px 0 8px;display:grid;grid-template-columns:repeat(4,1fr)}
.dy-service-item{display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:6px}
.dy-service-item .sico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.dy-service-item .stxt{font-size:11px;color:#333}
.dy-asset-card{background:#fff;border-radius:12px;margin:0 14px 10px;overflow:hidden}
.dy-asset-row{display:flex;align-items:center;padding:18px 16px;border-bottom:1px solid #f5f5f5}
.dy-asset-row:last-child{border-bottom:none}
.dy-asset-row .aico{width:32px;height:32px;border-radius:50%;border:1.5px solid #e0e0e0;display:flex;align-items:center;justify-content:center;margin-right:10px;font-size:14px;flex-shrink:0}
.dy-asset-row .ainfo{flex:1}
.dy-asset-row .ainfo .at{font-size:15px;font-weight:500;color:#333;display:flex;align-items:center;gap:6px}
.dy-asset-row .ainfo .at .atag{font-size:10px;color:#07c160;border:1px solid #07c160;padding:0 4px;border-radius:8px}
.dy-asset-row .ainfo .at .atag-red{font-size:10px;color:#ff4d4f;background:#fff1f0;padding:1px 6px;border-radius:8px}
.dy-asset-row .ainfo .ad{font-size:12px;color:#999;margin-top:3px}
.dy-asset-row .aval{font-size:17px;font-weight:500;color:#333;font-family:'DIN Alternate',sans-serif;margin-right:4px}
.dy-asset-row .aarrow{color:#ccc;font-size:16px}

/* ===== Bank ===== */
.bank-page{background:#f5f5f5;min-height:100%}
.bank-card-visual{margin:20px 16px;border-radius:16px;padding:24px;color:#fff;position:relative;overflow:hidden;min-height:190px}
.bank-card-visual::before{content:'';position:absolute;top:-30%;right:-10%;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.bank-card-visual::after{content:'';position:absolute;bottom:-40%;left:-5%;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.04)}
.bank-card-visual .row1{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.bank-card-visual .blogo{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.bank-card-visual .bname{font-size:17px;font-weight:600}
.bank-card-visual .btype{font-size:12px;opacity:.7;margin-top:2px}
.bank-card-visual .cardno{font-size:24px;letter-spacing:4px;font-family:'Courier New','SF Mono',monospace;margin-top:24px;position:relative;z-index:1}
.bank-card-visual .bal-area{margin-top:20px;position:relative;z-index:1}
.bank-card-visual .bal-label{font-size:12px;opacity:.6}
.bank-card-visual .bal-val{font-size:34px;font-weight:200;margin-top:4px;font-family:'DIN Alternate','Helvetica Neue',sans-serif;letter-spacing:-1px}
.bank-detail-card{background:#fff;border-radius:var(--radius);margin:0 16px 12px;overflow:hidden}
.bank-detail-row{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #f5f5f5;font-size:14px}
.bank-detail-row:last-child{border-bottom:none}
.bank-detail-row .k{color:var(--text2)}
.bank-trans{background:#fff;border-radius:var(--radius);margin:0 16px 16px;padding:16px 20px}
.bank-trans h3{font-size:15px;font-weight:600;margin-bottom:12px}
.bank-trans-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f8f8f8}
.bank-trans-item:last-child{border-bottom:none}
.bank-trans-item .name{font-size:14px}
.bank-trans-item .date{font-size:12px;color:var(--text2);margin-top:2px}
.bank-trans-item .amt{font-size:15px;font-weight:500;font-family:'DIN Alternate',sans-serif}
.bank-trans-item .amt.in{color:var(--green)}

/* ===== WeChat Chat ===== */
.wx-chat-page{background:#ececec;min-height:680px;display:flex;flex-direction:column}
.wx-chat-body{flex:1;padding:12px 12px 16px;overflow-y:auto}
.wx-chat-time{text-align:center;padding:8px 0;font-size:11px;color:#b2b2b2}
.wx-chat-time span{background:rgba(0,0,0,.06);padding:2px 8px;border-radius:4px;font-size:11px;color:#999}
.wx-chat-row{display:flex;align-items:flex-start;margin-bottom:14px;gap:8px}
.wx-chat-row.me{flex-direction:row-reverse}
.wx-chat-avatar{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;flex-shrink:0}
.wx-chat-bubble{max-width:65%;padding:10px 12px;border-radius:6px;font-size:15px;line-height:1.5;position:relative;word-break:break-word}
.wx-chat-row:not(.me) .wx-chat-bubble{background:#fff;color:#333;border-top-left-radius:2px}
.wx-chat-row:not(.me) .wx-chat-bubble::before{content:'';position:absolute;left:-6px;top:10px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.wx-chat-row.me .wx-chat-bubble{background:#95ec69;color:#333;border-top-right-radius:2px}
.wx-chat-row.me .wx-chat-bubble::before{content:'';position:absolute;right:-6px;top:10px;border:6px solid transparent;border-left-color:#95ec69;border-right:0}
.wx-chat-input-bar{background:#f5f5f5;border-top:1px solid #ddd;padding:8px 10px;display:flex;align-items:center;gap:8px}
.wx-chat-input-bar .voice-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.wx-chat-input-bar .input-area{flex:1;background:#fff;border-radius:6px;padding:8px 10px;font-size:15px;color:#999;min-height:18px}
.wx-chat-input-bar .emoji-btn,.wx-chat-input-bar .plus-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.chat-msg-list{max-height:300px;overflow-y:auto;border:1px solid #e8e8e8;border-radius:8px;background:#fff;margin-bottom:12px}
.chat-msg-item{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #f5f5f5;font-size:13px;gap:8px}
.chat-msg-item:last-child{border-bottom:none}
.chat-msg-item .tag{width:36px;font-size:11px;color:#999;flex-shrink:0;text-align:center}
.chat-msg-item .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chat-msg-item .del-btn{width:24px;height:24px;border-radius:50%;background:#ff4d4f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}
.chat-add-row{display:flex;gap:6px;margin-bottom:12px}
.chat-add-row select,.chat-add-row input{flex:1;padding:10px;border:1px solid #e8e8e8;border-radius:8px;font-size:14px;background:#fff}
.chat-add-row select{flex:0 0 80px}
.chat-add-row .add-btn{flex:0 0 48px;background:#07c160;color:#fff;border-radius:8px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ===== Utility ===== */
.home-indicator{width:134px;height:5px;background:#333;border-radius:3px;margin:8px auto 4px}
.home-indicator.light{background:rgba(255,255,255,.3)}
.hidden{display:none!important}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0)}

/* ===== Custom Modal ===== */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{background:#fff;border-radius:14px;width:280px;max-width:88vw;overflow:hidden;transform:scale(.9);transition:transform .2s}
.modal-overlay.show .modal-box{transform:scale(1)}
.modal-body{padding:24px 20px 16px;text-align:center}
.modal-body .modal-title{font-size:17px;font-weight:600;color:#333;margin-bottom:8px}
.modal-body .modal-msg{font-size:14px;color:#666;line-height:1.6}
.modal-btns{display:flex;border-top:1px solid #e8e8e8}
.modal-btns button{flex:1;padding:14px;font-size:16px;background:none;border:none;cursor:pointer;transition:background .15s}
.modal-btns button:active{background:#f0f0f0}
.modal-btns button.modal-cancel{color:#666;border-right:1px solid #e8e8e8}
.modal-btns button.modal-ok{color:#07c160;font-weight:600}
.modal-btns button:only-child{border-right:none}
</style>
</head>
<body>
<div id="app">
<div class="screen active" id="homeScreen">
  <div class="home-header">
    <h1>钱包模拟器</h1>
    <p>多平台钱包界面模拟 v3.0</p>
  </div>
  <div class="disclaimer">
    <strong>仅供娱乐用途，切勿用于任何违法活动！</strong><br>
    所有展示内容均为模拟数据，不代表真实账户信息。使用者需自行承担因不当使用产生的一切后果。
  </div>
  <div class="home-grid" id="homeGrid"></div>
</div>
<div class="screen" id="editorScreen"><div id="editorContent"></div></div>
<div class="screen" id="previewScreen"><div id="previewContent"></div></div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box"><div class="modal-body"><div class="modal-title" id="modalTitle"></div><div class="modal-msg" id="modalMsg"></div></div><div class="modal-btns" id="modalBtns"></div></div></div>

<script>
// ===== BANKS DATA =====
const BANKS=[

{n:'中国邮政储蓄银行',s:'邮储银行',c:'#007a4d',code:'PSBC'},
{n:'招商银行',s:'招商银行',c:'#c8102e',code:'CMB'},
{n:'中国民生银行',s:'民生银行',c:'#00a3e0',code:'CMBC'},
{n:'兴业银行',s:'兴业银行',c:'#003da5',code:'CIB'},
{n:'浦发银行',s:'浦发银行',c:'#003087',code:'SPDB'},
{n:'中信银行',s:'中信银行',c:'#c8102e',code:'CITIC'},
{n:'光大银行',s:'光大银行',c:'#6b2fa0',code:'CEB'},
{n:'华夏银行',s:'华夏银行',c:'#c8102e',code:'HXB'},
{n:'广发银行',s:'广发银行',c:'#c8102e',code:'CGB'},
{n:'平安银行',s:'平安银行',c:'#fa6400',code:'PAB'},

// ===== HELPERS =====
function fmtMoney(str){
  let v=String(str).replace(/[^\d.]/g,'');
  let parts=v.split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function fmtInput(el){
  let cursor=el.selectionStart;
  let raw=el.value.replace(/,/g,'');
  let oldLen=el.value.length;
  el.value=fmtMoney(raw);
  let newLen=el.value.length;
  el.setSelectionRange(cursor+(newLen-oldLen),cursor+(newLen-oldLen));
  return raw;
}
function genOrder(){return 'T'+Date.now().toString().slice(-12)+Math.random().toString(36).slice(2,6).toUpperCase();}
function genTime(){let d=new Date();return d.getFullYear()+'-'+(''+(d.getMonth()+1)).padStart(2,'0')+'-'+(''+(d.getDate())).padStart(2,'0')+' '+(''+(d.getHours())).padStart(2,'0')+':'+(''+(d.getMinutes())).padStart(2,'0')+':'+(''+(d.getSeconds())).padStart(2,'0');}
function lighten(hex,amt){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];let r=Math.min(255,parseInt(hex.substr(0,2),16)+amt);let g=Math.min(255,parseInt(hex.substr(2,2),16)+amt);let b=Math.min(255,parseInt(hex.substr(4,2),16)+amt);return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
var _escDiv=document.createElement('div');
function escapeHtml(s){_escDiv.textContent=s;return _escDiv.innerHTML;}
function safeColor(c){return /^#[0-9a-fA-F]{3,6}$/.test(c)?c:'#333';}
function safeNet(n){return['WiFi','5G','4G'].indexOf(n)>=0?n:'4G';}
var _dbTimers={};
function debounce(fn,key,ms){clearTimeout(_dbTimers[key]);_dbTimers[key]=setTimeout(fn,ms||80);}

function showModal(msg,opts){
  opts=opts||{};
  var ov=document.getElementById('modalOverlay');
  var title=opts.title||'提示';
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalMsg').textContent=msg;
  var btnsEl=document.getElementById('modalBtns');
  btnsEl.innerHTML='';
  if(opts.onCancel){
    var cb=document.createElement('button');cb.className='modal-cancel';cb.textContent=opts.cancelText||'取消';
    cb.onclick=function(){ov.classList.remove('show');opts.onCancel();};btnsEl.appendChild(cb);
  }
  var ob=document.createElement('button');ob.className='modal-ok';ob.textContent=opts.okText||'确定';
  ob.onclick=function(){ov.classList.remove('show');if(opts.onOk)opts.onOk();};btnsEl.appendChild(ob);
  ov.classList.add('show');
}

// ===== NAVIGATION =====
let screenStack=['homeScreen'];
function goTo(screenId){
  let cur=document.getElementById(screenStack[screenStack.length-1]);
  cur.classList.remove('active');cur.classList.add('prev');
  let next=document.getElementById(screenId);
  next.classList.add('active');next.classList.remove('prev');
  screenStack.push(screenId);
}
function goBack(){
  if(screenStack.length<=1)return;
  let cur=document.getElementById(screenStack.pop());
  cur.classList.remove('active');
  let prev=document.getElementById(screenStack[screenStack.length-1]);
  prev.classList.add('active');prev.classList.remove('prev');
  setTimeout(function(){cur.scrollTop=0;},350);
}

function uploadAvatar(input,isMe){
  var file=input.files[0];if(!file)return;
  if(file.size>2*1024*1024){showModal('图片不能超过2MB');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    if(isMe){S.chatMyAvatarImg=e.target.result;}
    else{S.chatAvatarImg=e.target.result;}
    edWxChat();
  };
  reader.readAsDataURL(file);
}

function renderChatMsgList(){
  var el=document.getElementById('chatMsgList');if(!el)return;
  if(S.chatMsgs.length===0){el.innerHTML='<div style="padding:20px;text-align:center;color:#999;font-size:13px">暂无消息，请在下方添加</div>';return;}
  el.innerHTML=S.chatMsgs.map(function(m,i){
    var tag=m.type==='time'?'时间':m.from==='me'?'我':'对方';
    var tagColor=m.type==='time'?'#999':m.from==='me'?'#07c160':'#1677ff';
    return '<div class="chat-msg-item"><span class="tag" style="color:'+tagColor+';font-weight:600">'+tag+'</span><span class="txt">'+escapeHtml(m.text)+'</span><div class="del-btn" onclick="delChatMsg('+i+')">x</div></div>';
  }).join('');
}

function addChatMsg(){
  var type=document.getElementById('chatAddType').value;
  var text=document.getElementById('chatAddText').value.trim();
  if(!text)return;
  if(type==='time'){S.chatMsgs.push({type:'time',text:text});}
  else{S.chatMsgs.push({type:'text',from:type,text:text});}
  document.getElementById('chatAddText').value='';
  renderChatMsgList();renderWxChat();
  var countEl=document.getElementById('chatMsgCount');
  if(countEl)countEl.textContent='聊天消息（'+S.chatMsgs.length+'条）';
}

function delChatMsg(idx){
  S.chatMsgs.splice(idx,1);
  renderChatMsgList();renderWxChat();
}

function renderWxChat(){
  var el=document.getElementById('prevWxChat');if(!el)return;
  var ac=safeColor(S.chatAvatarColor);
  var mc=safeColor(S.chatMyAvatarColor);
  var msgs=S.chatMsgs.map(function(m){
    if(m.type==='time'){
      return '<div class="wx-chat-time"><span>'+escapeHtml(m.text)+'</span></div>';
    }
    var isMe=m.from==='me';
    var avatarC=isMe?mc:ac;
    var avatarT=isMe?escapeHtml(S.chatMyAvatarText||'我'):escapeHtml(S.chatAvatarText||'?');
    var avatarImg=isMe?S.chatMyAvatarImg:S.chatAvatarImg;
    var avatarH=avatarImg?'<img src="'+avatarImg+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0">':'<div class="wx-chat-avatar" style="background:'+avatarC+'">'+avatarT+'</div>';
    return '<div class="wx-chat-row'+(isMe?' me':'')+'">'+
      avatarH+
      '<div class="wx-chat-bubble">'+escapeHtml(m.text)+'</div>'+
    '</div>';
  }).join('');

// ===== EXPORT SCREENSHOT =====
function exportScreenshot(previewId,onlyPreview){
  var el=document.getElementById(previewId);
  if(!el){showModal('预览区域未找到');return;}
  if(typeof html2canvas==='undefined'){showModal('截图库加载中，请稍后重试');return;}
  html2canvas(el,{scale:3,useCORS:true,backgroundColor:null,logging:false}).then(function(canvas){
    var link=document.createElement('a');
    link.download='wallet-'+Date.now()+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  }).catch(function(e){showModal('截图失败：'+e.message);});
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}

// ===== AUTO-SAVE STATE =====
var _saveTimer;
function scheduleSave(){clearTimeout(_saveTimer);_saveTimer=setTimeout(saveState,300);}
// Proxy-like save: wrap S in a setter-aware pattern
// Since we mutate S directly, we hook into refreshPreview and render* calls
var _origRefresh=null;
(function(){
  var origRenderHome=renderHome;
  // Intercept all oninput by saving after each render cycle
  var origEditorShell=editorShell;
  editorShell=function(t,f,pf,pid){
    var wrappedPf=function(){pf();scheduleSave();};
    origEditorShell(t,f,wrappedPf,pid);
    // Also wrap refreshPreview
    var origRP=refreshPreview;
    refreshPreview=function(){origRP();scheduleSave();};
  };
})();
// Also save when chat messages change
var origAddChat=addChatMsg,origDelChat=delChatMsg;
addChatMsg=function(){origAddChat();scheduleSave();};
delChatMsg=function(i){origDelChat(i);scheduleSave();};
// Save on avatar upload
var origUpload=uploadAvatar;
uploadAvatar=function(input,isMe){origUpload(input,isMe);scheduleSave();};

// ===== INIT =====
var saved=loadState();
if(saved){
  renderHome();
  showModal('检测到上次的数据，是否恢复？',{
    title:'数据恢复',
    okText:'恢复',
    cancelText:'重新开始',
    onOk:function(){
      // Restore saved state
      for(var k in saved){if(saved.hasOwnProperty(k))S[k]=saved[k];}
    },
    onCancel:function(){
      // Clear saved data, use defaults
      try{localStorage.removeItem(STORE_KEY);}catch(e){}
    }
  });
}else{
  renderHome();
}
</script>
